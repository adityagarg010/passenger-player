name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project PassengerPlayer.xcodeproj \
            -scheme PassengerPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PassengerPlayer.app Payload/
          zip -qr PassengerPlayer.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PassengerPlayer-ipa
          path: PassengerPlayer.ipa

      # If the build fails, this prints just the error lines so they are easy to copy.
      - name: Show errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -60 || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
